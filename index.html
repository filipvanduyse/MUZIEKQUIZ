<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b16"><title>OPPERCHAMPI • Muziekquiz</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#101b16;--surface:#1b2a22;--line:#36443b;--fg:#f3f3e6;--muted:#b5c3b7;--lime:#d5fa78;--orange:#ffb177;--pink:#fa8bb1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 5% 0%,#36533a 0%,transparent 34%),radial-gradient(ellipse at 94% 91%,#342c39,transparent 46%),var(--bg);color:var(--fg);font-family:'DM Sans',system-ui,sans-serif;min-height:100dvh}main{max-width:680px;margin:auto;padding:24px 18px 85px}.brand{display:flex;align-items:center;justify-content:space-between;margin:6px 0 22px;gap:12px}.logo{font:700 19px 'Space Grotesk';letter-spacing:-.8px}.logo span{color:var(--lime)}.pill{font-size:11px;letter-spacing:.08em;font-weight:800;border:1px solid #667661;border-radius:30px;padding:8px 10px;color:var(--lime)}.hero{margin:26px 0 24px}.eyebrow{letter-spacing:.18em;color:var(--lime);text-transform:uppercase;font-weight:800;font-size:11px}.hero h1{font:700 clamp(45px,11vw,74px)/.98 'Space Grotesk';letter-spacing:-3px;margin:14px 0}.hero h1 em{color:var(--lime);font-style:normal}.lead{line-height:1.55;color:var(--muted);font-size:16px}.card{background:linear-gradient(145deg,#213329,#18281f);border:1px solid #48604a;border-radius:23px;padding:22px;margin:16px 0;box-shadow:0 12px 45px #0710093b}.card.soft{background:#18241d;border-color:var(--line)}.sectionTitle{font:700 22px 'Space Grotesk';margin:0 0 13px}button{font-family:inherit;cursor:pointer;transition:transform .12s}button:active{transform:scale(.985)}.btn{width:100%;border:0;border-radius:15px;padding:17px 15px;font-weight:800;font-size:15px;background:var(--lime);color:#182316;margin-top:12px}.btn.alt{background:#344637;color:#f1f4e8;border:1px solid #526d52}.btn.pink{background:var(--pink);color:#2c1420}.btn:disabled{opacity:.45;cursor:not-allowed}.field{width:100%;font:600 17px inherit;border:1px solid #566b56;border-radius:13px;background:#132017;color:white;padding:16px;margin:6px 0 8px;outline:0}.field:focus{border-color:var(--lime)}label{display:block;font-weight:800;font-size:12px;color:var(--muted);margin:10px 0 4px}.small{font-size:12px;color:var(--muted);line-height:1.6}.error{padding:12px;background:#562f34;border-radius:10px;color:#ffdada;margin:10px 0}.hide{display:none!important}.headRow{display:flex;justify-content:space-between;align-items:center;gap:10px}.bigcode{font:700 42px 'Space Grotesk';letter-spacing:.16em;color:var(--lime);margin:5px 0 15px;text-align:center}.qrbox{background:white;border-radius:17px;width:max-content;margin:14px auto;padding:12px;max-width:100%}.qrbox img{display:block;width:208px;height:208px;max-width:100%}.sharelink{overflow-wrap:anywhere;text-align:center;font-size:12px;color:var(--muted)}.playerGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:15px}.player{padding:13px;border:1px solid var(--line);border-radius:13px;background:#18271f;font-weight:800}.player small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.qtitle{font:700 clamp(25px,6.5vw,38px)/1.13 'Space Grotesk';letter-spacing:-1px;margin:15px 0 22px}.progress{height:6px;background:#3b4a40;border-radius:20px;overflow:hidden;margin:13px 0 27px}.progress>div{height:100%;background:var(--lime);transition:width .3s}.options{display:grid;gap:11px}.opt{display:flex;align-items:center;text-align:left;gap:13px;background:#213329;border:1px solid #52624f;border-radius:16px;padding:15px 13px;color:white;font-size:15px;font-weight:650;min-height:67px}.opt b{background:#425745;color:var(--lime);border-radius:10px;min-width:34px;height:34px;display:grid;place-items:center}.opt.correct{border-color:var(--lime);background:#344d31}.opt.wrong{border-color:var(--pink);background:#50303a}.opt.chosen{outline:2px solid var(--orange)}.status{border:1px solid #586e50;padding:15px;border-radius:15px;text-align:center;color:var(--lime);font-weight:700;margin-top:18px}.visual{height:240px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:19px;background:radial-gradient(circle at 50% 36%,#58755c,#1c3026 70%);border:1px solid #61765b;margin:15px 0 22px}.visual svg{width:100%;height:100%}.results{display:grid;gap:8px}.result{display:flex;align-items:center;justify-content:space-between;background:#24352b;border:1px solid #435549;padding:12px 14px;border-radius:12px}.result strong{font-weight:800}.answer{background:#30452e;border:1px solid var(--lime);padding:15px;border-radius:14px;margin:10px 0}.explain{line-height:1.55;color:var(--muted)}.rank{display:flex;align-items:center;gap:12px;padding:14px 12px;background:#203026;border:1px solid #3f5543;border-radius:14px;margin:9px 0}.rank.first{background:linear-gradient(100deg,#4c5730,#283b27);border-color:var(--lime)}.rank .pos{font:700 27px 'Space Grotesk';width:36px;color:var(--lime)}.rank .rankname{font-weight:800;flex:1}.rank .score{font:700 22px 'Space Grotesk';color:var(--lime)}.bar{height:4px;background:#4a5b4b;margin-top:6px;border-radius:4px}.bar>div{height:100%;background:var(--lime);border-radius:4px}.champ{font:700 clamp(46px,13vw,90px)/1 'Space Grotesk';text-align:center;color:var(--lime);letter-spacing:-3px;overflow-wrap:anywhere;padding:25px 0 15px}.crown{font-size:80px;text-align:center;animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-9px) rotate(5deg)}}.foot{font-size:11px;color:#9daa9c;line-height:1.6;margin-top:35px;text-align:center}.sparkle{position:fixed;pointer-events:none;font-size:24px;animation:fall 3s linear forwards}@keyframes fall{from{top:-50px;opacity:1}to{top:100vh;opacity:0;transform:rotate(700deg)}}
</style></head><body><main><header class="brand"><div class="logo">🍄 OPPER<span>CHAMPI</span></div><div class="pill" id="tag">MUZIEKEDITIE</div></header><div id="app"></div><footer class="foot">Zes vrienden. Eén troon. Geen genade. 🍄<br>36 songs · 36 beeldraadsels · 6 quizmasters · 1 opperchampi.</footer></main><script type="module" src="/app.js"></script></body></html>
